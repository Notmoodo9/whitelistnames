name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: TEMP inspect entity tracking
        continue-on-error: true
        run: |
          set +e
          ./gradlew -q help > /dev/null
          JAR=$(find ~/.gradle -name 'minecraft-merged-deobf-26.2.jar' | head -1)
          jp() { echo "===== $*"; javap -cp "$JAR" "$@" 2>&1; }
          jp -p net.minecraft.world.entity.Entity | grep -iE 'broadcastToPlayer|isInvisibleTo|shouldBeSaved'
          jp -c -p 'net.minecraft.server.level.ChunkMap$TrackedEntity' | grep -E 'invoke' | grep -iE 'broadcast|Entity\.|pairing|addPairing' | sort -u
          jp -c -p net.minecraft.server.level.ServerEntity | awk '/sendPairingData/{p=1} p{print} /^$/{p=0}' | grep -E 'invoke|new|Passengers' | head -40
          jp -c -p net.minecraft.server.level.ServerEntity | grep -E 'SetPassengers|lastPassengers|sendToTrackingPlayers|broadcast' | sort -u
          jp -p net.minecraft.network.protocol.game.ClientboundSetPassengersPacket | grep -E 'public'
          jp -p net.minecraft.server.level.ServerPlayer | grep -E ' connection'
          jp -p net.minecraft.server.network.ServerCommonPacketListenerImpl | grep -E 'void send\('
          jp -p net.minecraft.server.level.ServerLevel | grep -E 'players\(\)'
          jp -c -p net.minecraft.client.multiplayer.ClientPacketListener | awk '/handleSetEntityPassengersPacket/{p=1} p{print} /^$/{p=0}' | grep -E 'invoke|ldc' | head -30
          true
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Find jar
        id: jar
        run: echo "path=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: whitelistnames
          path: ${{ steps.jar.outputs.path }}

      # Every push to main replaces the "latest" release with the new jar.
      - name: Publish latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${{ steps.jar.outputs.path }}" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built automatically from ${GITHUB_SHA::7}. Download the .jar below and put it (plus Fabric API) in your server's mods folder."

      # Pushing a tag like v1.0.0 creates a versioned release.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.jar.outputs.path }}" \
            --title "Whitelist Names $GITHUB_REF_NAME" --generate-notes

      # Starts a real server with the mod and runs the mod's commands over RCON.
      - name: Smoke test on a real server
        timeout-minutes: 15
        run: |
          mkdir -p run
          echo eula=true > run/eula.txt
          printf 'enable-rcon=true\nrcon.password=test\nrcon.port=25575\nonline-mode=false\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nspawn-protection=0\n' > run/server.properties
          ./gradlew runServer --console=plain > server.log 2>&1 &
          for i in $(seq 100); do grep -q 'Done (' server.log && break; grep -qE 'BUILD FAILED|Crash|Failed to start|BUILD SUCCESSFUL' server.log && break; sleep 5; done
          echo "waited $((i*5))s"; tail -5 server.log
          timeout 120 python3 .github/smoke/rcon.py || true
          sleep 3
          echo '===== server log (filtered)'
          grep -nE 'whitelistnames|Whitelist|[Mm]ixin|ERROR|Exception|WARN|Done \(' server.log | head -80
          echo '===== last lines'
          tail -30 server.log
          pkill -f runServer || true; pkill java || true
          grep -q 'Done (' server.log || { echo 'SERVER DID NOT START'; exit 1; }
