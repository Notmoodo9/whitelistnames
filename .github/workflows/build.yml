name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Find jar
        id: jar
        run: echo "path=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: whitelistnames
          path: ${{ steps.jar.outputs.path }}

      # Every push to main replaces the "latest" release with the new jar.
      - name: Publish latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${{ steps.jar.outputs.path }}" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built automatically from ${GITHUB_SHA::7}. Download the .jar below and put it (plus Fabric API) in your server's mods folder."

      # Pushing a tag like v1.0.0 creates a versioned release.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.jar.outputs.path }}" \
            --title "Whitelist Names $GITHUB_REF_NAME" --generate-notes

      - name: TEMP inspect vanilla code
        run: |
          set +e
          JAR=$(find ~/.gradle -name 'minecraft-merged-deobf-26.2.jar' | head -1)
          echo "JAR=$JAR"
          CP="$JAR"
          jp() { echo "===== $*"; javap -cp "$CP" "$@" 2>&1; }
          for c in 'net.minecraft.world.entity.Display' 'net.minecraft.world.entity.Display$BillboardConstraints'; do jp -c -p "$c" | grep -E '// String' | sort -u | head -80; done
          jp -c -p net.minecraft.world.entity.Entity | grep -E '// String (Tags|UUID)' | sort -u
          jp -c -p net.minecraft.server.players.PlayerList | awk '/getPlayer\(java.lang.String\)|getPlayerByName\(/{p=1} p{print} /^$/{p=0}' | head -60
          jp -c -p net.minecraft.world.entity.player.Player | grep -n 'getName' | head
          jp -p net.minecraft.world.level.Level | grep -E 'getEntity\('
          jp -p net.minecraft.world.level.EntityGetter | grep -E 'getEntity\('

      - name: TEMP smoke test on a real server
        run: |
          mkdir -p run
          echo eula=true > run/eula.txt
          printf 'enable-rcon=true\nrcon.password=test\nrcon.port=25575\nonline-mode=false\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nspawn-protection=0\n' > run/server.properties
          ./gradlew runServer --console=plain > server.log 2>&1 &
          for i in $(seq 120); do grep -q 'Done (' server.log && break; grep -qE 'BUILD FAILED|Crash' server.log && break; sleep 5; done
          python3 .github/smoke/rcon.py || true
          sleep 3
          echo '===== server log (filtered)'
          grep -nE 'whitelistnames|Whitelist|[Mm]ixin|ERROR|Exception|WARN|Done \(' server.log | head -80
          echo '===== last lines'
          tail -30 server.log
