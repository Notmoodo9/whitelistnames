name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish releases
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
      - name: TEMP look up Fabric versions for 26.3
        continue-on-error: true
        run: |
          set +e
          echo "== game versions (newest first)"; curl -s https://meta.fabricmc.net/v2/versions/game | python3 -c "import json,sys; print([v['version'] for v in json.load(sys.stdin)][:15])"
          echo "== loader"; curl -s https://meta.fabricmc.net/v2/versions/loader | python3 -c "import json,sys; d=json.load(sys.stdin); print([(v['version'], v['stable']) for v in d][:8])"
          echo "== loader for 26.3"; curl -s https://meta.fabricmc.net/v2/versions/loader/26.3 | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d), [v['loader']['version'] for v in d][:5])"
          echo "== fabric-api 26.3"; curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '<version>[^<]*26\.3[^<]*</version>' | tail -5
          echo "== loom"; curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -6
          echo "== yarn/intermediary 26.3 (should be none, unobfuscated)"; curl -s https://meta.fabricmc.net/v2/versions/intermediary/26.3 | head -c 300; echo
          echo "== mojang manifest"; curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['latest']); print([v['id'] for v in d['versions']][:10])"
          true
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Find jar
        id: jar
        run: echo "path=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: whitelistnames
          path: ${{ steps.jar.outputs.path }}

      # Every push to main replaces the "latest" release with the new jar.
      - name: Publish latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${{ steps.jar.outputs.path }}" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built automatically from ${GITHUB_SHA::7}. Download the .jar below and put it (plus Fabric API) in your server's mods folder."

      # A new mod_version in gradle.properties on main creates a versioned release (e.g. v1.0.1).
      - name: Publish versioned release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "Release v$version already exists"
          else
            gh release create "v$version" "${{ steps.jar.outputs.path }}" \
              --target "$GITHUB_SHA" --title "Whitelist Names $version" --generate-notes
          fi

      # Pushing a tag like v1.0.0 also creates a versioned release.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.jar.outputs.path }}" \
              --title "Whitelist Names $GITHUB_REF_NAME" --generate-notes
          fi

      # Starts a real server with the mod and runs the mod's commands over RCON.
      - name: Smoke test on a real server
        timeout-minutes: 15
        run: |
          mkdir -p run
          echo eula=true > run/eula.txt
          printf 'enable-rcon=true\nrcon.password=test\nrcon.port=25575\nonline-mode=false\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nspawn-protection=0\n' > run/server.properties
          ./gradlew runServer --console=plain > server.log 2>&1 &
          for i in $(seq 100); do grep -q 'Done (' server.log && break; grep -qE 'BUILD FAILED|Crash|Failed to start|BUILD SUCCESSFUL' server.log && break; sleep 5; done
          echo "waited $((i*5))s"; tail -5 server.log
          smoke=0; timeout 120 python3 .github/smoke/rcon.py || smoke=$?
          sleep 3
          echo '===== server log (filtered)'
          grep -nE 'whitelistnames|Whitelist|[Mm]ixin|Self-test|ERROR|Exception|WARN|Done \(' server.log | head -80
          echo '===== last lines'
          tail -30 server.log
          pkill -f runServer || true; pkill java || true
          grep -q 'Done (' server.log || { echo 'SERVER DID NOT START'; exit 1; }
          grep -q 'Self-test OK' server.log || { echo 'MIXIN SELF-TEST DID NOT PASS'; exit 1; }
          exit $smoke
