name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish releases
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
      - name: TEMP inspect player info
        continue-on-error: true
        run: |
          set +e
          ./gradlew -q help > /dev/null
          JAR=$(find ~/.gradle -name 'minecraft-merged-deobf-26.2.jar' | head -1)
          AUTH=$(find ~/.gradle -name 'authlib-*.jar' | grep -v sources | head -1)
          echo "AUTH=$AUTH"
          jp() { echo "===== $*"; javap -cp "$JAR:$AUTH" "$@" 2>&1; }
          jp -p net.minecraft.network.protocol.game.ClientboundPlayerInfoUpdatePacket
          jp -p 'net.minecraft.network.protocol.game.ClientboundPlayerInfoUpdatePacket$Entry'
          jp -p 'net.minecraft.network.protocol.game.ClientboundPlayerInfoUpdatePacket$Action' | head -20
          jp -c -p 'net.minecraft.network.protocol.game.ClientboundPlayerInfoUpdatePacket$Action' | grep -E 'GameProfile|writeUtf|name\(\)|PLAYER_NAME|StreamCodec' | head -20
          jp -p com.mojang.authlib.GameProfile
          jp -p net.minecraft.network.protocol.game.ClientboundPlayerInfoRemovePacket | grep public
          jp -p net.minecraft.network.protocol.game.ClientboundRemoveEntitiesPacket | grep public
          jp -p net.minecraft.util.StringUtil | grep -iE 'player|valid'
          jp -c -p net.minecraft.util.StringUtil | awk '/isValidPlayerName/{p=1} p{print} /^$/{p=0}' | head -30
          jp -p net.minecraft.server.level.ServerChunkCache | grep -E 'chunkMap'
          jp -p net.minecraft.server.level.ChunkMap | grep -E 'entityMap|TrackedEntity'
          jp -p 'net.minecraft.server.level.ChunkMap$TrackedEntity'
          jp -p net.minecraft.server.level.ServerEntity | grep -E 'Pairing'
          jp -p net.minecraft.server.network.ServerCommonPacketListenerImpl | grep -E 'send|Profile|player'
          jp -p net.minecraft.server.network.ServerGamePacketListenerImpl | grep -E ' player;|getPlayer'
          jp -c -p net.minecraft.server.players.PlayerList | grep -E 'ClientboundPlayerInfoUpdatePacket|PlayerInfoRemove' | sort -u
          jp -p net.minecraft.server.players.PlayerList | grep -E ' remove\('
          true
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Find jar
        id: jar
        run: echo "path=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        with:
          name: whitelistnames
          path: ${{ steps.jar.outputs.path }}

      # Every push to main replaces the "latest" release with the new jar.
      - name: Publish latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${{ steps.jar.outputs.path }}" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built automatically from ${GITHUB_SHA::7}. Download the .jar below and put it (plus Fabric API) in your server's mods folder."

      # Pushing a tag like v1.0.0 creates a versioned release.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.jar.outputs.path }}" \
            --title "Whitelist Names $GITHUB_REF_NAME" --generate-notes

      # Starts a real server with the mod and runs the mod's commands over RCON.
      - name: Smoke test on a real server
        timeout-minutes: 15
        run: |
          mkdir -p run
          echo eula=true > run/eula.txt
          printf 'enable-rcon=true\nrcon.password=test\nrcon.port=25575\nonline-mode=false\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nspawn-protection=0\n' > run/server.properties
          ./gradlew runServer --console=plain > server.log 2>&1 &
          for i in $(seq 100); do grep -q 'Done (' server.log && break; grep -qE 'BUILD FAILED|Crash|Failed to start|BUILD SUCCESSFUL' server.log && break; sleep 5; done
          echo "waited $((i*5))s"; tail -5 server.log
          smoke=0; timeout 120 python3 .github/smoke/rcon.py || smoke=$?
          sleep 3
          echo '===== server log (filtered)'
          grep -nE 'whitelistnames|Whitelist|[Mm]ixin|ERROR|Exception|WARN|Done \(' server.log | head -80
          echo '===== last lines'
          tail -30 server.log
          pkill -f runServer || true; pkill java || true
          grep -q 'Done (' server.log || { echo 'SERVER DID NOT START'; exit 1; }
          exit $smoke
