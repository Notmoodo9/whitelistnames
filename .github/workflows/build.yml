name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Find jar
        id: jar
        run: echo "path=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: whitelistnames
          path: ${{ steps.jar.outputs.path }}

      # Every push to main replaces the "latest" release with the new jar.
      - name: Publish latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${{ steps.jar.outputs.path }}" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built automatically from ${GITHUB_SHA::7}. Download the .jar below and put it (plus Fabric API) in your server's mods folder."

      # Pushing a tag like v1.0.0 creates a versioned release.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.jar.outputs.path }}" \
            --title "Whitelist Names $GITHUB_REF_NAME" --generate-notes

      - name: TEMP inspect vanilla code
        run: |
          set +e
          JAR=$(find ~/.gradle -name 'minecraft-merged-deobf-26.2.jar' | head -1)
          echo "JAR=$JAR"
          CP="$JAR"
          jp() { echo "===== $*"; javap -cp "$CP" "$@" 2>&1; }
          jp -c -p net.minecraft.world.entity.Entity | awk '/startRiding\(/{p=1} p{print} /^$/{p=0}' | head -120
          jp -p net.minecraft.world.entity.Entity | grep -iE 'tag|riding|passenger|getUUID|discard'
          jp -c -p net.minecraft.server.commands.RideCommand | grep -iE 'player|canSerialize|ldc' | head -30
          jp -p net.minecraft.commands.CommandSourceStack | grep -iE 'player|names'
          jp -c -p net.minecraft.commands.arguments.selector.EntitySelectorParser | awk '/parseNameOrUUID/{p=1} p{print} /^$/{p=0}' | head -40
          jp -c -p net.minecraft.commands.arguments.selector.EntitySelector | grep -iE 'getPlayerByName|playerName' | head
          jp -c -p net.minecraft.world.entity.player.Player | awk '/getDisplayName\(\)/{p=1} p{print} /^$/{p=0}' | head -40
          jp -p net.minecraft.server.level.ServerPlayer | grep -iE 'tablist|level\(\)|getPlayer|teleport'
          jp -c -p 'net.minecraft.world.entity.Display$TextDisplay' | grep -E 'ldc|String ' | head -40
          jp -c -p 'net.minecraft.world.entity.Display' | grep -E 'ldc +#[0-9]+ +// String' | head -60
          jp -p net.minecraft.server.players.PlayerList | grep -iE 'byname|getPlayer\('
          jp -p net.minecraft.server.level.ServerLevel | grep -iE 'getEntity\(|getAllEntities'
          jp -c -p net.minecraft.server.level.ServerPlayer | grep -iE 'ejectPassengers|stopRiding' | head
